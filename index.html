<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人橫式作品集</title>
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="橫式不裁切圖文作品展示">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style id="theme-style">
        :root {
            --bg-color: #fdfaf5;
            --card-bg: #ffffff;
            --accent-color: #d4a373;
            --text-color: #4a4a4a;
            --font-size-base: 16px;
            --card-aspect: 16 / 10; 
        }
    </style>
    <style>
        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Noto Sans TC', sans-serif; transition: all 0.3s ease;
            margin: 0; padding: 40px; min-height: 100vh; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }

        .admin-panel {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 15px 25px; border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; gap: 12px;
            align-items: center; margin-bottom: 40px; position: sticky; top: 20px; z-index: 1000;
            flex-wrap: wrap; justify-content: center; border: 1px solid #eee;
        }
        .viewer-mode .admin-panel { display: none; }
        .control-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: bold; color: #555; }
        input[type="color"] { border: none; width: 22px; height: 22px; cursor: pointer; background: none; }
        input[type="range"] { width: 70px; accent-color: var(--accent-color); }
        .divider { border-left: 1px solid #ddd; height: 24px; margin: 0 5px; }
        button { padding: 8px 18px; border-radius: 20px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-main { background: var(--accent-color); color: white; }
        .btn-share { background: #333; color: white; }

        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 450px), 1fr)); 
            gap: 40px; width: 100%; max-width: 1400px; 
        }
        
        .card-container { 
            width: 100%;
            aspect-ratio: var(--card-aspect); 
            perspective: 1500px; 
            cursor: pointer; 
        }
        .card-inner { 
            position: relative; width: 100%; height: 100%; 
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); 
            transform-style: preserve-3d; border-radius: 20px; 
            will-change: transform; 
        }
        .card-container.is-flipped .card-inner { transform: rotateY(180deg); }
        .editing .card-inner { transform: rotateY(180deg) !important; }

        .card-front, .card-back { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; border-radius: 20px; 
            box-shadow: 0 12px 35px rgba(0,0,0,0.08); background: var(--card-bg); 
            overflow: hidden; display: flex; flex-direction: column;
        }

        .card-front img { 
            width: 100%; height: 100%; 
            object-fit: contain; 
            background: var(--card-bg); 
            pointer-events: none; 
        }

        .card-back { 
            transform: rotateY(180deg); 
            padding: 25px; box-sizing: border-box; 
        }
        
        .title { 
            font-family: 'Playfair Display', serif; 
            font-size: calc(var(--font-size-base) * 1.5); 
            color: var(--accent-color); margin-bottom: 10px; outline: none; 
        }
        .scroll-content { 
            flex-grow: 1; overflow-y: auto; 
            font-size: var(--font-size-base); 
            line-height: 1.7; color: var(--text-color); 
            outline: none; white-space: pre-wrap; 
        }

        .edit-tools { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ddd; display: none; }
        .editing .edit-tools { display: block; }
        .img-url-input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 8px; font-size: 11px; background: rgba(0,0,0,0.02); }
        .delete-btn { background:#ff7675; color:white; padding:5px; border-radius:8px; width: 100%; border:none; cursor:pointer; }
        
        #hint { position: fixed; bottom: 20px; font-size: 10px; color: #ccc; opacity: 0; transition: 0.3s;}
        body:hover #hint { opacity: 1; }

        @media (max-width: 600px) {
            body { padding: 20px; }
            .card-container { aspect-ratio: 16 / 11; }
        }
    </style>
</head>
<body ondblclick="toggleUI()">

    <div class="admin-panel" id="ui-panel">
        <div class="control-item">背景<input type="color" id="p-bg" onchange="updateUI()"></div>
        <div class="control-item">卡片<input type="color" id="p-card" onchange="updateUI()"></div>
        <div class="control-item">文字<input type="color" id="p-text" onchange="updateUI()"></div>
        <div class="control-item">強調<input type="color" id="p-accent" onchange="updateUI()"></div>
        <div class="control-item">字體<input type="range" id="p-size" min="12" max="24" value="16" oninput="updateUI()"></div>
        <div class="divider"></div>
        <button class="btn-main" onclick="toggleEdit()" id="edit-btn">✏️ 編輯模式</button>
        <button onclick="addCard()">＋ 新增</button>
        <button class="btn-share" onclick="saveAndCopy()">🔗 產生分享連結</button>
    </div>

    <div class="gallery" id="gallery"></div>
    <div id="hint">點擊卡片翻轉｜雙擊背景隱藏工具欄</div>

    <script>
        let isEditing = false;
        let siteData = {
            theme: { bg: "#fdfaf5", card: "#ffffff", accent: "#d4a373", text: "#4a4a4a", size: 16 },
            cards: [{ title: "橫式作品範例", img: "https://duk.tw/images/2026/02/08/example.png", text: "點擊可翻轉。此版本採用橫向 16:10 比例，且圖片絕對不會被裁切。" }]
        };

        function init() {
            const h = window.location.hash.substring(1);
            const isEmbedded = window.self !== window.top;

            if (h.startsWith('data=')) {
                document.body.classList.add('viewer-mode');
                try {
                    const b64 = h.replace('data=', '');
                    siteData = JSON.parse(decodeURIComponent(escape(atob(b64))));
                } catch(e) { console.error("Load Error"); }
            } else {
                if (isEmbedded) document.body.classList.add('viewer-mode');
                const local = localStorage.getItem('Gallery_V61_Fix');
                if (local) siteData = JSON.parse(local);
            }
            syncControls();
            updateUI();
            render();
        }

        function toggleUI() { document.body.classList.toggle('viewer-mode'); }

        // --- 核心修正：翻轉邏輯 ---
        function handleCardClick(event) {
            // 如果是編輯模式，點擊文字或工具列不翻轉（為了讓你可以編輯）
            if (isEditing && (event.target.closest('.edit-tools') || event.target.closest('.scroll-content') || event.target.closest('.title'))) {
                return;
            }
            // 觀賞模式（isEditing 為 false）下，點擊任何地方都會切換翻轉
            this.classList.toggle('is-flipped');
        }

        function syncControls() {
            document.getElementById('p-bg').value = siteData.theme.bg;
            document.getElementById('p-card').value = siteData.theme.card || "#ffffff";
            document.getElementById('p-text').value = siteData.theme.text;
            document.getElementById('p-accent').value = siteData.theme.accent;
            document.getElementById('p-size').value = siteData.theme.size;
        }

        function updateUI() {
            siteData.theme = {
                bg: document.getElementById('p-bg').value,
                card: document.getElementById('p-card').value,
                accent: document.getElementById('p-accent').value,
                text: document.getElementById('p-text').value,
                size: document.getElementById('p-size').value
            };
            const r = document.documentElement.style;
            r.setProperty('--bg-color', siteData.theme.bg);
            r.setProperty('--card-bg', siteData.theme.card);
            r.setProperty('--accent-color', siteData.theme.accent);
            r.setProperty('--text-color', siteData.theme.text);
            r.setProperty('--font-size-base', siteData.theme.size + 'px');
        }

        function render() {
            const g = document.getElementById('gallery'); 
            g.innerHTML = ''; 
            siteData.cards.forEach((c, i) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `card-container ${isEditing ? 'editing' : ''}`;
                cardDiv.onclick = function(e) { handleCardClick.call(this, e); };
                cardDiv.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"><img src="${c.img}" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/450x300?text=Image+URL+Error';"></div>
                        <div class="card-back">
                            <div class="title" contenteditable="${isEditing}" oninput="siteData.cards[${i}].title=this.innerText">${c.title}</div>
                            <div class="scroll-content" contenteditable="${isEditing}" oninput="siteData.cards[${i}].text=this.innerText">${c.text}</div>
                            <div class="edit-tools">
                                <input type="text" class="img-url-input" placeholder="貼上網址或 HTML 代碼" value="${c.img}" oninput="smartUpdateImg(${i}, this.value)">
                                <button class="delete-btn" onclick="event.stopPropagation();siteData.cards.splice(${i},1);render()">刪除卡片</button>
                            </div>
                        </div>
                    </div>`;
                g.appendChild(cardDiv);
            });
        }

        function smartUpdateImg(i, input) {
            let url = input.trim();
            if (url.includes('<img')) {
                const match = url.match(/src=["']([^"']+)["']/);
                if (match && match[1]) url = match[1];
            }
            siteData.cards[i].img = url;
            const img = document.querySelectorAll('.card-container img')[i];
            if(img) img.src = url;
        }

        function toggleEdit() {
            isEditing = !isEditing;
            document.getElementById('edit-btn').innerText = isEditing ? "✅ 完成" : "✏️ 編輯模式";
            if (!isEditing) {
                document.querySelectorAll('.card-container').forEach(c => c.classList.remove('is-flipped'));
                localStorage.setItem('Gallery_V61_Fix', JSON.stringify(siteData));
            }
            render();
        }

        function addCard() {
            siteData.cards.push({ title: "新標題", img: "https://via.placeholder.com/450x300?text=New", text: "文章內容..." });
            render();
        }

        function saveAndCopy() {
            try {
                const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(siteData))));
                const shareUrl = window.location.origin + window.location.pathname + "#data=" + b64;
                navigator.clipboard.writeText(shareUrl).then(() => alert("🔗 分享連結已成功複製！"));
            } catch (e) { alert("連結產生失敗。"); }
        }

        init();
    </script>
</body>
</html>
